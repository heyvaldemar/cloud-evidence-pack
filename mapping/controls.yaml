# Which controls a scheduled cloud run of the flagship gives evidence for,
# and which lines of that run's own results carry it.
#
# This file is the mapping, written for a person to read. scripts/pack.py
# turns it and one run's artifact into OSCAL assessment results, and
# scripts/component.py turns it into the component definition in oscal/;
# CI fails if that file and this one differ.
#
# A control is here only when three things are true:
#   1. the flagship's own page, docs/compliance.md, has the row;
#   2. the check that row names runs in the cloud workflow, and writes a
#      line into the run's e2e-results.json;
#   3. the run shows a violation that check refused, beside something that
#      had to succeed, so a check cannot pass because the environment
#      refuses everything.
# Each control says what it leaves out. Nothing here says that a system
# meets a framework: a pack shows what one scheduled run did.

version: 1.1.0
last_modified: "2026-11-13T04:52:30+00:00"

# The system whose runs these are, and the hand-made page every control
# below is a row of. The runs are read from this repository and no other.
flagship:
  repository: heyvaldemar/kubernetes-air-gapped-ai-agent
  branch: main
  page: docs/compliance.md
  plants: tests/e2e/plants
  # Where the flagship keeps each finished cloud run, signed (its ADR 25):
  # the branch, and the workflow whose identity the signature must carry.
  results: cloud-results
  signer: .github/workflows/cloud-results.yml

framework:
  id: nist_800_53
  title: NIST SP 800-53 Rev. 5.2.0
  catalog: NIST_SP-800-53_rev5_catalog.json

# Other frameworks: related criteria beside a finding, never a finding. Each
# comes from a crosswalk published by NIST or by the framework's owner,
# pinned in catalogs.lock by sha256 and read as it is: what it relates to a
# control and to that control alone, and nothing where it relates nothing.
# A crosswalk relates two documents. It says nothing about a system, and
# NIST's own page warns against reading its rows as equivalence.
crosswalks:
  iso-27001-2022:
    title: ISO/IEC 27001:2022
    by: NIST's own crosswalk from SP 800-53 Rev. 5 (OLIR informative reference 155, version 1.0.0, posted 2023-11-13)
    file: sp800-53r5-to-iso-27001-mapping-2022-OLIR-2023-10-12-UPDATED.xlsx
    page: https://csrc.nist.gov/projects/olir/informative-reference-catalog/details?referenceId=155

# One leg per cloud: the workflow whose scheduled runs are read, and the
# artifact each run keeps. A run started by hand, on another branch or by
# another workflow is never a pack's source.
clouds:
  aws:
    title: AWS
    where: an EKS cluster in a VPC with no internet gateway and no NAT
    workflow: .github/workflows/aws.yml
    artifact: e2e-results-aws
    decision: docs/decisions/0018-the-boundary-on-aws.md
  gke:
    title: Google Cloud
    where: a private GKE cluster in a VPC made without its route to the internet
    workflow: .github/workflows/gke.yml
    artifact: e2e-results-gke
    decision: docs/decisions/0022-the-boundary-on-gke.md
  aks:
    title: Azure
    where: a network isolated AKS cluster; the boundary alone, with no agent on it
    workflow: .github/workflows/aks.yml
    artifact: e2e-results-aks
    decision: docs/decisions/0023-the-boundary-on-aks.md

# The lines of a run's e2e-results.json a control can rest on. Each names
# either a line, as a regular expression the whole line must match, or a
# plant: a pod in the flagship's tests/e2e/plants, whose line is
# "<name>: refused (<its own # expect: words>)" or "<name>: admitted".
#
#   kind: refusal   an attempt at the violation, made in the run, refused
#   kind: control   something that had to succeed in the same run
#   kind: gate      an outcome held to a number
#
# at_least is how many lines must match (1 when absent), for every cloud or
# cloud by cloud: it is the number each cloud's run writes today, so a line
# that goes missing or is renamed upstream is noticed even when another
# still matches. Every line that matches must have passed. clouds is where
# the line is written. A line the mapping names and the run does not have
# leaves its control not satisfied: a renamed line is never skipped.
#
# A run can write the same line more than once, and each is a line of the
# run: counted, listed and observed as many times as the run wrote it.
checks:
  # --- the boundary, tried from inside: tests/e2e/<cloud>.sh ---------------
  pod-egress-tcp:
    kind: refusal
    clouds: [aws, gke, aks]
    line: 'a pod opens no TCP to (1\.1\.1\.1:443|8\.8\.8\.8:53|151\.101\.0\.81:443)'
    at_least: 3
    says: A pod tries to open TCP to three public addresses, by IP. None answers.
  node-egress-tcp:
    kind: refusal
    clouds: [aws, gke, aks]
    line: 'the node opens no TCP to (1\.1\.1\.1:443|8\.8\.8\.8:53|151\.101\.0\.81:443)'
    at_least: 3
    says: The same three attempts from the node's own network. None answers.
  pod-dns-outside:
    kind: refusal
    clouds: [aws, gke, aks]
    line: 'a pod cannot resolve example\.(com|org) \(.+\)'
    at_least: {aws: 1, gke: 2, aks: 2}
    says: A pod asks the network's resolver for a public name. It gets no answer.
    # The day this check failed on each cloud: a run by hand with the
    # resolver's policy left off, where the same lookup got an answer.
    shown_failing:
      aws: {run: 39632816543, line: 'a pod resolved example\.com: .+'}
      gke: {run: 40560466605, line: 'a pod resolved example\.com: .+'}
      aks: {run: 41007916564, line: 'a pod resolved example\.com: .+'}
  node-dns-outside:
    kind: refusal
    clouds: [aws, gke, aks]
    line: 'the node cannot resolve example\.(com|org) \(.+\)'
    at_least: {aws: 1, gke: 2, aks: 2}
    says: The node asks for a public name. It gets no answer.
    shown_failing:
      aws: {run: 39632816543, line: 'the node resolved example\.com: .+'}
      gke: {run: 40560466605, line: 'the node resolved example\.com: .+'}
      aks: {run: 41007916564, line: 'the node resolved example\.com: .+'}
  pod-dns-direct:
    kind: refusal
    clouds: [aws, gke, aks]
    line: 'a pod cannot ask a public resolver directly \(8\.8\.8\.8\)'
    says: A pod asks a public resolver directly, past the network's own. It gets no answer.
  node-dns-direct:
    kind: refusal
    clouds: [aws, gke, aks]
    line: 'the node cannot ask a public resolver directly \(8\.8\.8\.8\)'
    says: The node asks a public resolver directly. It gets no answer.
  pod-other-door:
    kind: refusal
    clouds: [gke]
    line: 'a pod opens no TCP to private\.googleapis\.com \(\d+\.\d+\.\d+\.\d+:443\), Google''s other front door'
    says: A pod tries Google's other front door, which the node itself may use. It is refused.
  vendor-registry:
    kind: refusal
    clouds: [aks]
    line: '(a pod|the node) opens no TCP to mcr\.microsoft\.com \(\d+\.\d+\.\d+\.\d+:443\), where AKS''s own images are published'
    at_least: 2
    says: A pod and the node try the public registry AKS's own images are published in. Neither reaches it.
  registry-start:
    kind: control
    clouds: [aws, gke, aks]
    line: 'control: a pod starts from this run''s (ECR|registry), through (the endpoints|restricted\.googleapis\.com|its private endpoint), by digest \(\S+@sha256:[0-9a-f]{64}\)'
    says: A pod starts from an image in the run's own registry, pulled by digest through the private way in.
  cluster-dns:
    kind: control
    clouds: [aws, gke, aks]
    line: 'control: a pod resolves the cluster''s own services'
    says: The same pod resolves the cluster's own names, so a refused lookup is the policy's and not a dead resolver's.
  registry-dns:
    kind: control
    clouds: [aws, gke, aks]
    line: 'control: (a pod|the node) resolves \S+ to [0-9. ]+, (inside the VPC, through its endpoint|restricted\.googleapis\.com, from the network''s own zone|its private endpoint, from the network''s own zone)'
    at_least: 2
    says: The pod and the node resolve the registry's name to addresses inside the network.
  registry-tcp:
    kind: control
    clouds: [aws, gke, aks]
    line: 'control: (a pod|the node) opens TCP to \S+ on 443, through (its endpoint|restricted\.googleapis\.com|its private endpoint)'
    at_least: 2
    says: The pod and the node open TCP to the registry on 443, so a refused connection is the boundary's and not a dead probe's.

  # --- what is inside: tests/e2e/run.sh, checks 9 to 11 --------------------
  model-unsigned: {kind: refusal, clouds: [aws, gke], plant: model-unsigned, says: Model weights nobody signed.}
  model-stranger: {kind: refusal, clouds: [aws, gke], plant: model-stranger, says: Model weights signed with another key.}
  model-nobom: {kind: refusal, clouds: [aws, gke], plant: model-nobom, says: A model the operator signed, with no AI-BOM.}
  model-by-tag: {kind: refusal, clouds: [aws, gke], plant: model-by-tag, says: A model named by tag, not by digest.}
  volume-elsewhere: {kind: refusal, clouds: [aws, gke], plant: volume-elsewhere, says: Model weights from outside the registry's models path.}
  image-not-carried: {kind: refusal, clouds: [aws, gke], plant: image-not-carried, says: An image the signed bundle never carried.}
  image-by-tag: {kind: refusal, clouds: [aws, gke], plant: image-by-tag, says: An image named by tag alone.}
  model-signed: {kind: control, clouds: [aws, gke], plant: model-signed, says: The signed model with its AI-BOM is admitted.}
  bundle-tampered:
    kind: refusal
    clouds: [aws, gke]
    line: 'a bundle changed by one byte is refused, and loads nothing'
    says: The signed file that crosses the gap, with one byte changed, is refused before anything is loaded.
  registry-empty:
    kind: control
    clouds: [aws, gke]
    line: 'the registry inside held nothing when the bundle was loaded'
    says: The run's registry held nothing before the bundle was loaded.
  registry-exact:
    kind: control
    clouds: [aws, gke]
    line: 'it holds exactly what the bundle carried \(\d+ tags, by digest\)'
    says: Afterwards it holds exactly what the bundle carried, tag by tag and by digest.
  pods-carried:
    kind: control
    clouds: [aws, gke]
    line: 'every pod outside the node image''s namespaces runs images the bundle carried \(\d+ pods, \d+ digests\)'
    says: Every running pod outside the node image's namespaces runs images whose digests the bundle carried.

  # --- the agent's side: scripts/evals.sh and tests/e2e/gameday.sh ---------
  gateway-around:
    kind: refusal
    clouds: [aws, gke]
    line: 'with the gateway''s pod killed, the model server still cannot be reached around it'
    says: With the gateway's pod killed, a request straight to the model server is still refused.
  gateway-answers:
    kind: control
    clouds: [aws, gke]
    line: 'control: the gateway answers for \S+ \(200\)'
    says: Through the gateway, the same request is answered.
  outside-email:
    kind: gate
    clouds: [aws, gke]
    line: 'emails delivered outside acme\.example: 0 \(gate: 0\)'
    says: No email was delivered outside the company's domain, through every task with an instruction planted in what the agent reads.
  control-email:
    kind: control
    clouds: [aws, gke]
    line: 'the harness''s control email arrived through the MCP server: yes \(control\)'
    says: The harness's own email inside the domain arrived, so no email outside is not a dead mail path.
  gateway-every-request:
    kind: gate
    clouds: [aws, gke]
    line: 'every model request went through the gateway: (\d+) asked by the agent, \1 answered by the gateway'
    says: The gateway's count of answered requests equals the agent's count of requests asked.

  # --- the records credential from Vault: tests/e2e/vault.sh ---------------
  # The flagship's AWS and Google Cloud workflows both run this script. A
  # scheduled AWS run has passed with it; these lines are named for Google
  # Cloud once a scheduled run there has. Who may get the credential, and
  # what it allows:
  vault-login-agent:
    kind: refusal
    clouds: [aws]
    line: 'Vault refuses a login by the agent''s service account, for Vault''s audience \(HTTP (400|403)\)'
    says: The agent's own service account asks Vault to log in, with a token for Vault's audience. Vault refuses it.
  vault-login-neighbour:
    kind: refusal
    clouds: [aws]
    line: 'Vault refuses a login by another service account in the MCP server''s namespace \(HTTP (400|403)\)'
    says: Another service account in the MCP server's own namespace asks Vault to log in. Vault refuses it.
  vault-login-api-token:
    kind: refusal
    clouds: [aws]
    line: 'Vault refuses a login by the MCP server''s own token for the Kubernetes API \(HTTP (400|403)\)'
    says: The MCP server's service account asks with its token for the Kubernetes API, not the one for Vault's audience. Vault refuses it.
  agent-to-vault:
    kind: refusal
    clouds: [aws]
    line: 'an agent pod cannot connect to Vault'
    says: An agent pod tries to open a connection to Vault. It cannot.
  records-delete:
    kind: refusal
    clouds: [aws]
    line: 'a delete with a valid credential: 403, no role issues records:delete, and the record is still there'
    says: A delete is sent with a credential the records service takes. It is refused, and the record is still there.
  vault-login-server:
    kind: control
    clouds: [aws]
    line: 'control: Vault takes the MCP server''s token for its audience'
    says: Vault takes the MCP server's token for Vault's audience, so a refused login is the role's and not a dead Vault's.
  agent-to-mcp:
    kind: control
    clouds: [aws]
    line: 'control: an agent pod connects to the MCP server'
    says: The same agent pod connects to the MCP server, so the connection it cannot open is the policy's and not a dead probe's.
  records-through-vault:
    kind: control
    clouds: [aws]
    line: 'control: acting for Dana, the MCP server reads C1001 from the records service with Vault''s credential'
    says: Through the MCP server, a record is read with the credential Vault issued.
  credential-scope:
    kind: control
    clouds: [aws]
    line: 'Vault''s credential: RS256, its issuer, audience records-api, scope records:read outbox:send, for mcp/mcp-server'
    says: The credential names the MCP server's service account, one audience, and a scope with no delete in it.
  credential-lifetime:
    kind: gate
    clouds: [aws]
    line: 'the credential lives \d+ s, at most the records service''s limit of 60 s'
    says: The credential's lifetime, read from the credential, is within the 60 seconds the records service allows.
  vault-audit-holder:
    kind: gate
    clouds: [aws]
    line: 'Vault''s audit names the service account of every credential it issued: \d+, all to mcp/mcp-server'
    says: Vault's own audit names the MCP server's service account for every credential it issued in the run.
  # What the records service takes as a caller's identity, and what it refuses:
  records-no-credential:
    kind: refusal
    clouds: [aws]
    line: 'no credential: 401'
    says: The records service is asked with no credential. It answers 401.
  records-random-key:
    kind: refusal
    clouds: [aws]
    line: 'a random key, the old kind of credential: 401'
    says: It is asked with a random key, the kind of credential it took before Vault. 401.
  records-cluster-token:
    kind: refusal
    clouds: [aws]
    line: 'the cluster''s own token for the audience records-api: 401'
    says: It is asked with a token the cluster itself issued for its audience, not Vault. 401.
  records-other-audience:
    kind: refusal
    clouds: [aws]
    line: 'a credential for another audience, signed by Vault''s own key: 401'
    says: It is asked with a credential Vault's key signed for another audience. 401.
  records-long-lived:
    kind: refusal
    clouds: [aws]
    line: 'a credential that lives longer than 60 s, though Vault issued it: 401'
    says: It is asked with a credential Vault issued for an hour. 401.
  records-expired:
    kind: refusal
    clouds: [aws]
    line: 'the first credential, once expired: 401'
    says: It is asked with the run's first credential after it expired. 401.
  records-takes-credential:
    kind: control
    clouds: [aws]
    line: 'control: the records service takes the credential for GET /records/C1001'
    says: The records service takes the credential Vault issued, so a 401 is its judgment of the credential and not a dead service.
  cluster-token-issued:
    kind: control
    clouds: [aws]
    line: 'any service account gets a token for the audience records-api from the cluster: the agent''s did'
    says: The cluster did issue a token for the records service's audience, to the agent's service account, so the token it refuses is a real one.
  other-audience-issued:
    kind: control
    clouds: [aws]
    line: 'plant: Vault issued a credential for the audience reports-api, signed by the records key'
    says: Vault did issue the credential for another audience, with the same key, so its refusal is for the audience.
  long-lived-issued:
    kind: control
    clouds: [aws]
    line: 'plant: with Vault''s TTL raised, it issued a credential for 3600 s'
    says: Vault did issue the credential that lives an hour, so its refusal is for the lifetime.
  records-fresh:
    kind: control
    clouds: [aws]
    line: 'the TTL put back: a new credential lives 60 s and is taken'
    says: With Vault's lifetime put back, a new credential is taken.
  records-caller:
    kind: control
    clouds: [aws]
    line: 'the records service logs who called: mcp/mcp-server'
    says: The records service's log names the caller by its service account.
  records-reasons:
    kind: control
    clouds: [aws]
    line: 'the records service''s log gives each reason: expired, lives longer than 60 s, no credential, no scope records:delete, not a JWT, signature not by Vault''s key, wrong audience'
    says: The records service's log gives a reason of its own for each refusal.

# Checks whose lines the flagship writes side by side, once each time it
# does the same thing in a run. Each must have as many lines as the others.
# at_least cannot say this, because the number is the run's own: an AWS run
# puts the agent through scripts/evals.sh a second time, on a larger model,
# when it has a GPU, and writes these three lines again; with no GPU, and on
# Google Cloud, it writes them once. A check here with fewer lines than
# another has lost one, and the line that is left does not stand for it.
written_together:
  - [outside-email, control-email, gateway-every-request]

# The controls, by NIST's own ids. page_row is the row of the flagship's
# docs/compliance.md a control is the machine-readable form of, as that
# page names it.
#
# since names, cloud by cloud, the first scheduled run whose results carried
# a control's lines, where that was not the first run read here. Every run
# of that cloud from that one on is asked for the control, and a run that
# has lost its lines leaves it not satisfied. An earlier run is not asked:
# the flagship did not do the thing yet, and a pack of that run says so
# instead of calling it a failure. The id is the run's own, from the record
# the flagship signed; a copy of the run is in tests/fixtures/runs.
controls:
  - control: sc-7
    name: SC-7 Boundary Protection
    page_row: SC-7 Boundary Protection
    clouds: [aws, gke, aks]
    checks: [pod-egress-tcp, node-egress-tcp, pod-dns-outside, node-dns-outside, pod-dns-direct, node-dns-direct,
             pod-other-door, vendor-registry, registry-start, cluster-dns, registry-dns, registry-tcp]
    implementation: >-
      The cluster's network has no route to the internet and its resolver
      answers for the cloud's own names and nothing else. The run tries the
      ways out from a pod and from the node, by address and by name, and each
      refusal stands beside a connection that had to work.
    not_covered: >-
      Control, not monitoring: an attempt to leave is refused, and nothing
      this run reads records it. IPv6 is not tried. The attempts are a pod's
      and the node's; the cloud's own control plane, and the runner's address
      that the cluster's API answers, are outside what is tried.

  - control: sc-7.5
    name: SC-7(5) Deny by Default, Allow by Exception
    page_row: SC-7 Boundary Protection
    clouds: [aws, gke, aks]
    checks: [pod-egress-tcp, node-egress-tcp, pod-dns-outside, node-dns-outside, pod-dns-direct, node-dns-direct,
             pod-other-door, vendor-registry, registry-start, registry-dns, registry-tcp]
    implementation: >-
      Everything out is refused, and the exceptions are the private ways in
      the cluster needs: the run's own registry by a private address, on 443,
      by digest. The run shows both halves, the refusals and each exception
      answering.
    not_covered: >-
      The run checks that the exceptions answer, not that they are the only
      ones: the cloud's other private endpoints the node needs to join are
      not listed here one by one. Reviewing the exceptions is a person's work.

  - control: ac-4
    name: AC-4 Information Flow Enforcement
    page_row: AC-4 Information Flow Enforcement
    clouds: [aws, gke]
    checks: [gateway-around, gateway-answers, outside-email, control-email, gateway-every-request]
    implementation: >-
      A model is reached only through the gateway, and data leaves only
      through a tool whose schema holds an email's recipient to the company's
      domain. The run kills the gateway's pod and tries the model server
      directly, and runs the agent through tasks with instructions planted in
      what it reads.
    not_covered: >-
      The schema holds a domain, not a person: emails to colleagues nobody
      named are counted, not refused, and nothing reads what a body carries.
      In a run where the model never writes an outside address, the email
      gate shows the outcome and not a refusal; the refusal this control
      rests on here is the way around the gateway.

  - control: si-7
    name: SI-7 Software, Firmware, and Information Integrity
    page_row: SI-7 Software, Firmware, and Information Integrity
    clouds: [aws, gke]
    checks: [bundle-tampered, model-by-tag, registry-empty, registry-exact]
    implementation: >-
      Everything the cluster runs crosses in one signed file whose checksums
      are verified before anything is loaded, and a model is named by digest,
      so a changed image is a different name.
    not_covered: >-
      Checked on the way in. Nothing re-verifies what the registry stores
      between runs, and the cloud's node image arrives outside the bundle.

  - control: sr-4
    name: SR-4 Provenance
    page_row: SR-4 Provenance
    clouds: [aws, gke]
    checks: [model-nobom, model-signed]
    implementation: >-
      A model is mounted only with an AI-BOM attested with the operator's key
      that pins it by publisher, revision and sha256.
    not_covered: >-
      Admission checks that the record is there and signed, not that it is
      true of the source. Where the training data came from is not recorded.
      Container images get no provenance check here.

  - control: sr-11
    name: SR-11 Component Authenticity
    page_row: SR-11 Component Authenticity
    clouds: [aws, gke]
    checks: [model-unsigned, model-stranger, volume-elsewhere, image-not-carried, image-by-tag, bundle-tampered,
             model-signed, pods-carried]
    implementation: >-
      The model is signed with the operator's key and verified at admission
      with no network; model weights come only from the registry's models
      path; every pod's images are held to the digests the signed bundle
      carried.
    not_covered: >-
      Checked against a key, with no certificate and no transparency log.
      Part (b), reporting a counterfeit to anyone, is a process and nothing
      here does it. The images of the cloud's own node are exempt.

  - control: ac-6
    name: AC-6 Least Privilege
    page_row: AC-6 Least Privilege
    clouds: [aws]
    since: {aws: 43199517532}
    checks: [vault-login-agent, vault-login-neighbour, vault-login-api-token, agent-to-vault, records-delete,
             vault-login-server, agent-to-mcp, records-through-vault, credential-scope, credential-lifetime,
             vault-audit-holder]
    implementation: >-
      The records service takes only a credential Vault issues: for 60
      seconds, to the MCP server's service account alone, with a scope that
      has no delete in it. The run asks Vault as the agent, as a neighbour of
      the MCP server and with the MCP server's wrong token, tries Vault from
      an agent pod, and sends a delete with a credential the service takes.
    not_covered: >-
      The records credential alone. The agent's own two tokens, the
      Kubernetes API token refused at the gateway and the rights of the
      person the agent acts for are tried in the flagship's daily runs on
      kind, not in a cloud run; of the person's rights a cloud run holds the
      evals' count, which this mapping does not name. Quotas and token
      budgets at the gateway are per agent, not per person (the flagship's
      gap 1). Scope is by tool and customer, not by field.

  - control: ia-9
    name: IA-9 Service Identification and Authentication
    page_row: IA-9 Service Identification and Authentication
    clouds: [aws]
    since: {aws: 43199517532}
    checks: [records-no-credential, records-random-key, records-cluster-token, records-other-audience,
             records-long-lived, records-expired, vault-login-api-token, records-takes-credential, vault-login-server,
             cluster-token-issued, other-audience-issued, long-lived-issued, records-fresh, records-caller,
             records-reasons]
    implementation: >-
      The records service knows its caller by a credential signed with
      Vault's key, and checks the signature, issuer, audience, expiry,
      lifetime and scope itself. Vault issues one only to the MCP server's
      service account, which logs in with a token for Vault's own audience.
      The run sends the records service no credential, a random key, the
      cluster's own token, a credential for another audience, one that lives
      an hour and an expired one, each beside a credential it takes.
    not_covered: >-
