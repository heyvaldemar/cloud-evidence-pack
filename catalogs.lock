# NIST's own OSCAL catalog of SP 800-53 Rev. 5, from
# github.com/usnistgov/oscal-content, pinned to one commit and to the file's
# sha256. scripts/catalogs.sh downloads it and refuses a file whose hash
# differs. Every finding names the catalog's own statement id, and
# scripts/component.py checks that every control the mapping names is in it.
#
# And NIST's own crosswalk from SP 800-53 Rev. 5 to ISO/IEC 27001:2022, the
# file its OLIR catalog serves as informative reference 155 (version 1.0.0,
# posted 2023-11-13). NIST's page prints this file's hash; it is this sha256,
# under the label SHA3-256.
#
# file  url  sha256
