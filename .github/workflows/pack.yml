name: Pack

# THE FLAGSHIP'S SCHEDULED CLOUD RUNS, AS SIGNED OSCAL EVIDENCE.
#
# checks      the static checks (scripts/validate.sh): the mapping against
#             NIST's catalog and the flagship's page, the committed copies of
#             real runs, trestle, the tests, every rule switched off in turn,
#             and every plant on every committed run; each check shown its
#             planted violation (tests/static/plants.tsv); shellcheck and
#             actionlint
# packs       a pack for every scheduled cloud run that passed and has none
#             yet (scripts/packs.sh): read from GitHub, built, validated by
#             trestle, judged by the gate, the run's record and the
#             artifact's digest asked from GitHub again; then signed keyless
#             with cosign. On a pull request, the committed runs only, and
#             nothing is signed. On a release, the newest scheduled run that
#             passed for each cloud, built on the tag
# keep        on main: the new packs, their signatures and the index, added
#             to the branch `packs`, which only grows
# provenance  on a release: SLSA provenance for the packs
# attach      on a release: attached, downloaded again and verified as a
#             stranger would, each shown a copy with one byte appended
#
# No cloud account and no stored secret. The flagship's run history is read
# with this workflow's own token, and no workflow is ever started there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    # Daily, after the latest hour a scheduled cloud run has finished so far
    # (12:01 UTC, run 42809539539): a run gets its pack the day it happens.
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Static checks, and that each can fail
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install trestle and the tools, each by hash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --no-deps -r requirements.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          bash scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: The flagship's release, verified, and NIST's catalog
        run: |
          bash scripts/flagship.sh
          bash scripts/catalogs.sh

      - name: The static checks
        run: bash scripts/validate.sh

      - name: Each check, shown its planted violation
        run: python3 tests/static/plant_violations.py

      - name: shellcheck and actionlint, the pinned images
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . <(grep -E '^[A-Z_]+=' ci-images.pins)
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" scripts/*.sh tests/e2e/*.sh
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  packs:
    name: A pack for each scheduled cloud run
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # cosign's keyless signature: the certificate names this workflow.
      id-token: write
    outputs:
      subjects: ${{ steps.sign.outputs.subjects }}
      built: ${{ steps.sign.outputs.built }}
    env:
      # What is read: the committed runs on a pull request, the newest run
      # that passed for each cloud on a release, otherwise every scheduled
      # run of the last 14 days that passed and has no pack yet.
      MODE: ${{ github.event_name == 'pull_request' && 'fixtures' || (github.event_name == 'release' && 'newest' || 'new') }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install trestle and the tools, each by hash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --no-deps -r requirements.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          bash scripts/install-tools.sh >> "$GITHUB_PATH"

      # A branch that is not there yet holds no packs; anything else that
      # goes wrong reading it stops the run.
      - name: The packs already kept
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/held"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if git ls-remote --exit-code --heads "https://github.com/$REPO.git" packs >/dev/null; then
            git clone -q --depth 1 -b packs "https://github.com/$REPO.git" "$RUNNER_TEMP/kept"
            for cloud in aws gke aks; do
              [ -d "$RUNNER_TEMP/kept/$cloud" ] && cp -R "$RUNNER_TEMP/kept/$cloud" "$RUNNER_TEMP/held/$cloud"
            done
            echo "the branch packs holds $(find "$RUNNER_TEMP/held" -name verdict.json | wc -l) pack(s)"
          else
            echo "no branch packs yet: no pack is kept"
          fi

      - name: Read the runs, build the packs, judge them
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/packs.sh "$RUNNER_TEMP/packs" "$RUNNER_TEMP/held"

      - name: What became of each scheduled run
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/packs/index.md" ]; then
            cat "$RUNNER_TEMP/packs/index.md" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no index was written"
          fi
          find "$RUNNER_TEMP/packs" -name refused.txt -print -exec cat {} \; 2>/dev/null || true

      # A pull request's packs are judged, not signed: a pull request from a
      # fork gets no OIDC token, and its packs are not this repository's.
      - name: Sign each pack, keyless, and verify the signature
        id: sign
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packs"
          built=0
          : > "$RUNNER_TEMP/subjects"
          while IFS= read -r -d '' pack; do
            cosign sign-blob --yes "$pack" --bundle "$pack.sigstore.json"
            cosign verify-blob "$pack" --bundle "$pack.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/pack.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            (cd "$(dirname "$pack")" && sha256sum "$(basename "$pack")") >> "$RUNNER_TEMP/subjects"
            built=$((built + 1))
          done < <(find . -name 'cloud-evidence-pack-*.tar.gz' -print0 | sort -z)
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "subjects=$(base64 -w0 < "$RUNNER_TEMP/subjects")" >> "$GITHUB_OUTPUT"
          echo "$built pack(s) signed as pack.yml at $GITHUB_REF"

      - name: Keep them with the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packs
          path: ${{ runner.temp }}/packs
          if-no-files-found: ignore
          retention-days: 90

  keep:
    name: Add the new packs to the branch `packs`
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'release'
    needs: packs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Push the branch `packs`.
      contents: write
    steps:
      - name: Download the packs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: new

      # The branch only grows: a pack that is there is never replaced, and
      # only the index is rewritten.
      - name: Add them, and the index
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if git ls-remote --exit-code --heads "https://github.com/$REPO.git" packs >/dev/null; then
            git clone -q -b packs "https://github.com/$REPO.git" kept
          else
            mkdir kept && git -C kept init -q -b packs
          fi
          added=0
          while IFS= read -r -d '' verdict; do
            dir="$(dirname "${verdict#new/}")"
            if [ -e "kept/$dir/verdict.json" ]; then continue; fi
            mkdir -p "kept/$dir" && cp -R "new/$dir/." "kept/$dir/"
            added=$((added + 1))
          done < <(find new -name verdict.json -print0)
          cp new/index.md kept/README.md
          cp new/index.json kept/index.json
          cd kept
          git add -A
          if git diff --cached --quiet; then echo "nothing new to keep"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "packs: $added added, index of $(date -u +%F)"
          git push -q "https://github.com/$REPO.git" packs
          echo "$added pack(s) added to the branch packs"

  provenance:
    name: SLSA provenance for the packs
    if: github.event_name == 'release'
    needs: packs
    permissions:
      actions: read
      id-token: write
      contents: write
    # By tag, as the generator requires (release-assets.yml says why).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.packs.outputs.subjects }}
      provenance-name: cloud-evidence-packs.intoto.jsonl
      upload-assets: false

  attach:
    name: Attach the packs to the release, and verify them as a stranger would
    if: github.event_name == 'release'
    needs: [packs, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download the packs and their signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: packs

      - name: Download their provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: out

      - name: Attach every pack, its signature, the provenance and the index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          find packs -name 'cloud-evidence-pack-*.tar.gz*' -exec cp {} out/ \;
          cp packs/index.md out/cloud-evidence-packs-index.md
          [ "$(find out -name '*.tar.gz' | wc -l)" -ge 1 ] || { echo "::error::the release has no pack to carry"; exit 1; }
          gh release upload "$TAG" out/* --clobber

      # From here nothing of the build is used: the files are the release's,
      # downloaded again.
      - name: Verify what the release now holds, and that a changed copy fails
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p check && cd check
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'cloud-evidence-pack-*' -p 'cloud-evidence-packs.intoto.jsonl'
          sig=(--certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/pack.yml@refs/tags/$TAG"
               --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          checked=0
          for pack in cloud-evidence-pack-*.tar.gz; do
            cosign verify-blob "$pack" --bundle "$pack.sigstore.json" "${sig[@]}"
            slsa-verifier verify-artifact "$pack" --provenance-path cloud-evidence-packs.intoto.jsonl \
              --source-uri "github.com/$GITHUB_REPOSITORY" --source-tag "$TAG"
            cp "$pack" changed.tar.gz && printf 'x' >> changed.tar.gz
            if cosign verify-blob changed.tar.gz --bundle "$pack.sigstore.json" "${sig[@]}"; then
              echo "::error::cosign accepted $pack with one byte appended"; exit 1
            fi
            if slsa-verifier verify-artifact changed.tar.gz --provenance-path cloud-evidence-packs.intoto.jsonl \
                 --source-uri "github.com/$GITHUB_REPOSITORY" --source-tag "$TAG"; then
              echo "::error::slsa-verifier accepted $pack with one byte appended"; exit 1
            fi
            checked=$((checked + 1))
          done
          [ "$checked" -ge 1 ] || { echo "::error::the release holds no pack"; exit 1; }
          echo "$checked pack(s) verify, and a changed copy of each does not"

      # The gate once more, on the packs the release holds, from a fresh
      # checkout of the tag: what the README tells a reader to do.
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      - name: The gate, on each pack the release holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd src
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --no-deps -r requirements.lock
          export PATH="$PWD/.venv/bin:$PATH"
          bash scripts/catalogs.sh
          for pack in ../check/cloud-evidence-pack-*.tar.gz; do
            rm -rf unpacked && mkdir unpacked && tar -xzf "$pack" -C unpacked
            bash scripts/validate.sh unpacked/evidence
            python3 scripts/gate.py unpacked/evidence --live
          done
